<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>時鐘練習</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#208e7b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時鐘練習">
  <link rel="apple-touch-icon" href="clock-icon-180.png">
  <link rel="icon" href="clock-icon-192.png">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #173b43;
      background: radial-gradient(ellipse at 12% 12%, #d9f5ed 0, transparent 32%),
        radial-gradient(ellipse at 90% 88%, #dceafa 0, transparent 36%), #f4f8f7;
      user-select: none; -webkit-user-select: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .round-btn {
      width: 54px; height: 54px; border-radius: 18px; border: 0;
      background: #173b43; color: #fff; font-size: 28px; font-weight: bold;
      box-shadow: 0 5px 14px rgba(23,59,67,.18); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- 選單 ---------- */
    #menu { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; }
    #menu h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 48px); color: #173b43; letter-spacing: .03em; }
    .home-btn { position: absolute; top: 18px; left: 18px; text-decoration: none; font-size: 25px; }
    .mode-select, #level-select { width: min(440px, 90vw); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #level-select { display: none; }
    #mode-caption { margin: 0 0 2px; color: #668187; font-size: 20px; font-weight: 700; }
    .mode-back { width: 100%; padding: 10px 16px; font-size: 18px; text-align: center; }
    .level {
      width: min(440px, 90vw); padding: 14px 20px; font-size: 24px; font-weight: 750;
      text-align: left; border: 2px solid #e2eeeb; border-radius: 18px; background: rgba(255,255,255,.9); color: #173b43;
      box-shadow: 0 5px 14px rgba(23,59,67,.07); cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .level:active { transform: translateY(2px); border-color: #55b9a6; box-shadow: 0 2px 7px rgba(23,59,67,.1); }
    .level small { display: block; margin-top: 3px; font-size: 15px; color: #668187; font-weight: 500; }

    /* ---------- 遊戲 ---------- */
    #game { height: 100%; display: none; position: relative; }
    #back { position: absolute; top: 18px; left: 18px; z-index: 5; }
    #help { position: absolute; bottom: 18px; right: 18px; z-index: 5; background: #fff; color: #173b43; }
    .layout { height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(24px, 4vw, 64px); padding: 24px 7vw; }
    #clock {
      width: min(54vw, 82vh); height: min(54vw, 82vh); touch-action: none; flex-shrink: 0;
      border-radius: 50%; background: #fff; box-shadow: 0 18px 45px rgba(31,76,82,.15), 0 0 0 10px rgba(255,255,255,.7);
    }
    .side {
      flex: 1; max-width: 470px; display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 24px; border: 1px solid rgba(218,234,230,.9); border-radius: 28px;
      background: rgba(255,255,255,.88); box-shadow: 0 18px 45px rgba(31,76,82,.09);
    }

    .score { display: flex; gap: 10px; }
    .tag { background: #edf7f4; color: #1c655a; font-size: 24px; font-weight: 700; padding: 9px 15px; border-radius: 14px; min-width: 92px; text-align: center; }
    .tag b { font-size: 21px; }
    .ok b { color: #28a687; } .ng b { color: #e47769; }
    #progress { color: #668187; font-size: 15px; font-weight: 650; }

    .question { width: 100%; background: #f2f8f6; text-align: center; padding: 14px; border-radius: 20px; }
    .question div:first-child { font-size: 21px; font-weight: 650; color: #668187; }
    #simple-hint { margin-top: 7px; padding: 8px 12px; border-radius: 12px; background: #dff3ed; color: #1c655a; font-size: clamp(16px, 2.6vh, 20px); font-weight: 750; }
    .target-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    #speak { font-size: 27px; width: 48px; height: 48px; border-radius: 15px; border: 0; background: #dff3ed; cursor: pointer; padding: 0; }
    #speak:active { transform: scale(.92); }
    #target { font-size: clamp(58px, 8vw, 82px); font-weight: 800; line-height: 1.1; color: #173b43; font-variant-numeric: tabular-nums; }

    .window { width: 100%; height: 126px; border: 7px solid #dbe9e6; border-radius: 20px; position: relative; overflow: hidden; transition: background 1s; }
    .window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 7px; margin-left: -3px; background: #dbe9e6; }
    #sky-icon { position: absolute; font-size: 54px; transition: all 1s; }
    .hill { position: absolute; bottom: -60px; left: -10%; width: 120%; height: 110px; border-radius: 50%; background: #57b48a; }

    #done {
      width: 100%; font-size: 30px; font-weight: 750; color: #fff; background: #208e7b;
      border: 0; border-radius: 18px; padding: 13px 30px; cursor: pointer;
      box-shadow: 0 6px 0 #176b5e; transition: transform .12s, box-shadow .12s;
    }
    #done:active { transform: translateY(4px); box-shadow: 0 2px 0 #176b5e; }

    #toast {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0);
      font-size: 120px; pointer-events: none; transition: transform .25s; z-index: 10;
    }
    #toast.show { transform: translate(-50%,-50%) scale(1); }
    .shake { animation: shake .4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }

    #result {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none;
      align-items: center; justify-content: center; z-index: 20;
    }
    #result .card { width: min(420px, 90vw); background: #fff; border: 1px solid #dcebe7; border-radius: 28px; padding: 30px 34px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    #result h2 { font-size: 38px; margin: 0 0 10px; color: #173b43; }
    #result .big-stars { font-size: 60px; margin: 10px 0; }
    #result p { font-size: 20px; margin: 6px 0 20px; color: #668187; }
    #again { text-align: center; background: #208e7b; color: #fff; border: 0; box-shadow: 0 5px 0 #176b5e; }

    /* 直立時上下排列 */
    @media (orientation: portrait) {
      #menu { gap: 12px; }
      #game { overflow-y: auto; }
      #back { top: 12px; left: 12px; }
      .layout { min-height: 100%; height: auto; flex-direction: column; justify-content: flex-start; gap: 12px; padding: 74px 16px 76px; }
      #clock { width: min(72vw, 40vh); height: min(72vw, 40vh); }
      .side { gap: 9px; width: min(100%, 500px); padding: 12px; border-radius: 22px; }
      .score { position: static; gap: 6px; }
      .tag { min-width: 64px; font-size: 18px; padding: 7px 9px; border-radius: 12px; }
      .tag b { font-size: 16px; }
      #progress { font-size: 13px; }
      .window { display: none; }
      .question { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 7px; }
      .question div:first-child { font-size: clamp(16px, 2.6vh, 21px); }
      #target { font-size: clamp(34px, 6vh, 58px); }
      #speak { width: 40px; height: 40px; font-size: 22px; }
      #done { font-size: clamp(22px, 3.5vh, 28px); padding: 9px 24px; }
    }
    /* 橫向但高度較矮（例如電腦小視窗） */
    @media (orientation: landscape) and (max-height: 700px) {
      .layout { gap: 3vw; padding-top: 12px; padding-bottom: 12px; }
      #clock { width: min(48vw, 78vh); height: min(48vw, 78vh); }
      #target { font-size: 11vh; }
      .window { height: 17vh; }
      #done { font-size: 6vh; padding: 8px 24px; }
      .side { gap: 1.5vh; padding: 16px; }
    }
    @media (orientation: portrait) and (max-height: 700px) {
      .layout { gap: 6px; padding-top: 66px; }
      #clock { width: min(60vw, 33vh); height: min(60vw, 33vh); }
      .side { gap: 5px; padding: 8px; }
      #done { padding: 6px 20px; }
    }
  </style>
</head>
<body>

<!-- 選單 -->
<div id="menu">
  <a href="./" class="round-btn home-btn" aria-label="回主頁">🏠</a>
  <h1>🕘 時鐘練習</h1>
  <div class="mode-select" id="mode-select">
    <button class="level" data-mode="general">一般版<small>自由調整時針和分針</small></button>
    <button class="level" data-mode="simple">簡單版<small>先調時針，再調分針</small></button>
  </div>
  <div id="level-select">
    <button class="level mode-back" id="mode-back">← 選擇版本</button>
    <div id="mode-caption">選擇練習難度</div>
    <button class="level" data-step="60">整點<small>例：9:00</small></button>
    <button class="level" data-step="30">半點<small>例：9:30</small></button>
    <button class="level" data-step="5">每 5 分鐘<small>例：9:25</small></button>
    <button class="level" data-step="1">每 1 分鐘<small>例：9:47</small></button>
  </div>
</div>

<!-- 遊戲 -->
<div id="game">
  <button id="back" class="round-btn" aria-label="返回">←</button>
  <button id="help" class="round-btn" aria-label="提示">?</button>

  <div class="layout">
    <svg id="clock" viewBox="-200 -200 400 400"></svg>

    <div class="side">
      <div class="score">
        <div class="tag ok"><span id="okCount">0</span> <b>✔</b></div>
        <div class="tag ng"><span id="ngCount">0</span> <b>✘</b></div>
      </div>
      <div class="question">
        <div>將時間調整為</div>
        <div id="simple-hint" hidden></div>
        <div class="target-row">
          <span id="target">9:00</span>
          <button id="speak" aria-label="唸出時間">🔊</button>
        </div>
      </div>
      <div class="window" id="window">
        <span id="sky-icon">☀️</span>
        <div class="hill"></div>
      </div>
      <button id="done">完成</button>
      <div id="progress"></div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="result">
    <div class="card">
      <h2>完成了！</h2>
      <div class="big-stars" id="resultStars"></div>
      <p id="resultText"></p>
      <button class="level" id="again">再玩一次</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = 10;           // 每回合題數
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

// ---------- 狀態 ----------
let step = 60;         // 題目間隔（分鐘）
let mode = 'general';
let simpleStage = 'hour';
let total = 0;         // 時鐘目前時間，0~719 分鐘（12 小時制）
let target = 0;        // 題目時間
let ok = 0, ng = 0, qIndex = 0, locked = false;
let session = 0;       // 每次開始或離開遊戲就 +1，用來取消還在等待中的流程

// ---------- 畫時鐘 ----------
const svg = $('clock');
function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function polar(r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [r * Math.cos(a), r * Math.sin(a)];
}

function drawFace() {
  el('circle', { r: 196, fill: '#208e7b' });
  el('circle', { r: 186, fill: '#ffffff' });

  for (let m = 0; m < 60; m++) {
    const deg = m * 6, five = m % 5 === 0;
    const [x1, y1] = polar(five ? 136 : 142, deg);
    const [x2, y2] = polar(156, deg);
    el('line', { x1, y1, x2, y2, stroke: five ? '#55b9a6' : '#9aabad', 'stroke-width': five ? 4 : 2.5, 'stroke-linecap': 'round' });

    const [tx, ty] = polar(171, deg);
    const t = el('text', {
      x: tx, y: ty, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': five ? 15 : 11, 'font-weight': five ? 'bold' : 'normal',
      fill: five ? '#208e7b' : '#426067'
    });
    t.textContent = String(m).padStart(2, '0');
  }

  for (let h = 1; h <= 12; h++) {
    const [x, y] = polar(112, h * 30);
    const t = el('text', {
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 44, fill: '#173b43', 'font-family': 'Arial, sans-serif'
    });
    t.textContent = h;
  }
}

// 指針：用 <g> 包起來，旋轉 g 即可；外加一條透明粗線讓手指容易點到
function makeHand(len, width, color) {
  const g = el('g', { class: 'hand', style: 'cursor:grab' });
  el('line', { x1: 0, y1: 0, x2: 0, y2: -len, stroke: 'transparent', 'stroke-width': 44 }, g);
  el('polygon', {
    points: `0,${-len} ${width},${-len * 0.62} 0,18 ${-width},${-len * 0.62}`,
    fill: color, stroke: '#176b5e', 'stroke-width': 2
  }, g);
  return g;
}

drawFace();
const hourHand = makeHand(88, 16, '#208e7b');
const minuteHand = makeHand(142, 11, '#55b9a6');
el('circle', { r: 16, fill: '#173b43' });

function render() {
  minuteHand.setAttribute('transform', `rotate(${(total % 60) * 6})`);
  hourHand.setAttribute('transform', `rotate(${total / 2})`);
  minuteHand.style.pointerEvents = mode === 'simple' && simpleStage === 'hour' ? 'none' : '';
  hourHand.style.pointerEvents = mode === 'simple' && simpleStage === 'minute' ? 'none' : '';
  const hint = $('simple-hint');
  hint.hidden = mode !== 'simple';
  if (mode === 'simple') {
    hint.textContent = simpleStage === 'hour'
      ? '第 1 步：先把短針（時針）轉到題目的小時數'
      : '時針到位！第 2 步：再調長針（分針）到正確分鐘';
  }
}

// ---------- 拖曳 ----------
let dragging = null;

function pointerAngle(e) {
  const r = svg.getBoundingClientRect();
  const x = e.clientX - (r.left + r.width / 2);
  const y = e.clientY - (r.top + r.height / 2);
  return (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
}
const wrap = v => ((v % 720) + 720) % 720;

function startDrag(hand, e) {
  if (locked) return;
  if (mode === 'simple' && (
    (hand === 'minute' && simpleStage === 'hour')
    || (hand === 'hour' && simpleStage === 'minute')
  )) return;
  dragging = hand;
  // iPad 需要在觸控當下建立／喚醒音效，之後拖動時的喀聲才會響
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    loadTickFile();
  } catch (_) {}
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
}
minuteHand.addEventListener('pointerdown', e => startDrag('minute', e));
hourHand.addEventListener('pointerdown', e => startDrag('hour', e));

svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const a = pointerAngle(e);
  const before = total;
  if (dragging === 'minute') {
    // 分針轉一圈，時針跟著走一小時（跟真的時鐘一樣）
    let delta = Math.round(a / 6) % 60 - total % 60;
    if (delta > 30) delta -= 60;
    if (delta < -30) delta += 60;
    total = wrap(total + delta);
  } else {
    // 拖時針：分針不動，時針只能停在「配合目前分鐘」的位置
    // （分針在 12 → 時針對準整點；分針在 6 → 時針停在兩個整點中間）
    const m = total % 60;
    const h = ((Math.round((a * 2 - m) / 60) % 12) + 12) % 12;
    total = h * 60 + m;
  }
  if (mode === 'simple' && simpleStage === 'hour' && dragging === 'hour'
      && Math.floor(total / 60) % 12 === Math.floor(target / 60) % 12) {
    simpleStage = 'minute';
    dragging = null;
    toast('時針到位！');
  }
  if (total !== before) soundTick();
  render();
});
const endDrag = () => { dragging = null; };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

// ---------- 音效 ----------
let actx;
function beep(notes) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([freq, start, dur]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'triangle';
      g.gain.setValueAtTime(0.25, actx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur);
    });
  } catch (_) {}
}
const soundOk = () => beep([[523, 0, .15], [659, .12, .15], [784, .24, .3]]);
const soundNg = () => beep([[220, 0, .25], [180, .2, .35]]);

// 轉動指針的「滴、答」聲，模仿機械時鐘秒針：
// 一小段雜訊經過帶通濾波（金屬撞擊的「喀」）+ 一個快速衰減的木質共鳴音，
// 滴／答交替用稍微不同的音高；限制最快每 60ms 一聲，快速拖動時才不會糊成一片
// 如果資料夾裡有 tick.mp3，就改播放這段錄音（沒有的話用下面的合成音）
let lastTick = 0, tickAlt = false, noiseBuf = null, tickFile = null, tickFileLoading = false;
const TICK_VOLUME = 1.0;   // tick.mp3 已經調到接近最大音量，再大會破音
function loadTickFile() {
  if (tickFile || tickFileLoading) return;
  tickFileLoading = true;
  fetch('tick.mp3')
    .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b => new Promise((ok, ng) => actx.decodeAudioData(b, ok, ng)))
    .then(buf => { tickFile = buf; })
    .catch(() => { setTimeout(() => { tickFileLoading = false; }, 5000); });  // 失敗的話 5 秒後可再試
}
function soundTick() {
  const now = performance.now();
  if (now - lastTick < 60) return;
  lastTick = now;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    loadTickFile();
    if (tickFile) {
      const s = actx.createBufferSource(), g = actx.createGain();
      s.buffer = tickFile;
      g.gain.value = TICK_VOLUME;
      s.connect(g).connect(actx.destination);
      s.start(t);
      return;
    }
    tickAlt = !tickAlt;

    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.03, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    const out = actx.createGain();
    out.gain.value = 1.0;              // 總音量
    out.connect(actx.destination);

    // 金屬「喀」
    const n = actx.createBufferSource(), bp = actx.createBiquadFilter(), ng = actx.createGain();
    n.buffer = noiseBuf;
    bp.type = 'bandpass'; bp.frequency.value = tickAlt ? 3200 : 2600; bp.Q.value = 3;
    ng.gain.value = 1.6;
    n.connect(bp).connect(ng).connect(out);
    n.start(t);

    // 木質共鳴
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(tickAlt ? 1400 : 1150, t);
    og.gain.setValueAtTime(0.5, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    o.connect(og).connect(out);
    o.start(t); o.stop(t + 0.05);
  } catch (_) {}
}

// ---------- 語音 ----------
// 使用系統內建的中文語音（iPad 有台灣中文語音，不需網路）
let zhVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => v.lang === 'zh-TW') || vs.find(v => v.lang.startsWith('zh')) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
// 回傳 Promise，唸完才 resolve；萬一瀏覽器沒觸發結束事件，也會依字數估算時間後自動 resolve
function say(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.85;   // 放慢一點，小朋友比較聽得清楚
    const fallback = setTimeout(resolve, 1500 + text.length * 400);
    u.onend = u.onerror = () => { clearTimeout(fallback); resolve(); };
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
// 9:00 → 九點鐘、2:30 → 兩點三十分
function timeWords(t) {
  const h = Math.floor(t / 60) || 12, m = t % 60;
  const hw = h === 2 ? '兩' : h;
  return m === 0 ? `${hw}點鐘` : `${hw}點${m}分`;
}
const PRAISES = ['好極了！', '做得好！', '你好棒！', '做對了！'];   // 答對時隨機唸一句
const speakTarget =() => say(`將時間調整為，${timeWords(target)}`);

// ---------- 遊戲流程 ----------
const fmt = t => `${Math.floor(t / 60) || 12}:${String(t % 60).padStart(2, '0')}`;
const starCount = () => ng === 0 ? 4 : ng <= 2 ? 3 : ng <= 4 ? 2 : 1;
const starText = n => '⭐'.repeat(n) + '☆'.repeat(4 - n);

function updateScore() {
  $('okCount').textContent = ok;
  $('ngCount').textContent = ng;
  $('progress').textContent = `第 ${Math.min(qIndex + 1, QUESTIONS)} / ${QUESTIONS} 題`;
}

function updateSky(t) {
  // 太陽依題目時間由左往右劃過天空（純裝飾）
  const pos = t / 720, icon = $('sky-icon');
  icon.style.left = `${5 + pos * 75}%`;
  icon.style.top = `${40 - Math.sin(pos * Math.PI) * 35}%`;
  $('window').style.background = 'linear-gradient(#5fb6ef, #bfe6ff)';
}

function newQuestion() {
  const slots = 720 / step;
  do { target = Math.floor(Math.random() * slots) * step; } while (target === total);
  simpleStage = mode === 'simple' && Math.floor(total / 60) % 12 === Math.floor(target / 60) % 12
    ? 'minute'
    : 'hour';
  $('target').textContent = fmt(target);
  updateSky(target);
  updateScore();
  locked = false;
  render();
  speakTarget();
}

function toast(txt) {
  const t = $('toast');
  t.textContent = txt;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 700);
}

$('done').addEventListener('click', () => {
  if (locked) return;
  if (total === target) {
    ok++; locked = true; soundOk(); toast('🎉');
    updateScore();
    // 先等音效、再唸完稱讚，最後才出下一題，避免稱讚被下一題的語音切掉
    const s = session;
    wait(400)
      .then(() => say(PRAISES[Math.floor(Math.random() * PRAISES.length)]))
      .then(() => wait(300))
      .then(() => {
        if (s !== session) return;  // 中途按了返回或重新開始，就不繼續
        qIndex++;
        if (qIndex >= QUESTIONS) showResult(); else newQuestion();
      });
  } else {
    ng++; soundNg(); toast('❌');
    setTimeout(() => say(`現在是${timeWords(total)}，再試一次`), 500);
    svg.classList.remove('shake'); void svg.offsetWidth; svg.classList.add('shake');
    updateScore();
  }
});

$('speak').addEventListener('click', speakTarget);
$('target').addEventListener('click', speakTarget);

$('help').addEventListener('click', () => {
  const m = target % 60, h = Math.floor(target / 60) || 12;
  const order = mode === 'simple' ? '\n簡單版：先調時針到正確小時，再調分針。' : '';
  alert(`提示：${order}\n長針（分針）指到 ${String(m).padStart(2, '0')}\n短針（時針）指到 ${h}${m ? ' 和 ' + (h % 12 + 1) + ' 之間' : ''}\n\n目前時鐘是 ${fmt(total)}`);
});

function showResult() {
  $('resultStars').textContent = starText(starCount());
  $('resultText').textContent = `答對 ${ok} 題，答錯 ${ng} 次`;
  $('result').style.display = 'flex';
  say(`完成了！你得到${starCount()}顆星星`);
}

function startGame(s) {
  step = s; ok = 0; ng = 0; qIndex = 0; total = 0; session++;
  render();
  $('menu').style.display = 'none';
  $('result').style.display = 'none';
  $('game').style.display = 'block';
  newQuestion();
}

document.querySelectorAll('#mode-select [data-mode]').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  $('mode-select').style.display = 'none';
  $('level-select').style.display = 'flex';
  $('mode-caption').textContent = `${mode === 'simple' ? '簡單版' : '一般版'}：選擇練習難度`;
}));
$('mode-back').addEventListener('click', () => {
  $('level-select').style.display = 'none';
  $('mode-select').style.display = 'flex';
});
document.querySelectorAll('#level-select [data-step]').forEach(b =>
  b.addEventListener('click', () => startGame(+b.dataset.step)));
$('again').addEventListener('click', () => startGame(step));
$('back').addEventListener('click', () => {
  session++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('game').style.display = 'none';
  $('menu').style.display = 'flex';
});

render();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js');
}
</script>
<script src="music.js" data-style="clock"></script>
</body>
</html>
